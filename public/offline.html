<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#176b3b">
  <title>KukuDhamini offline</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f8f4; color: #173b28; }
    * { box-sizing: border-box; } body { margin: 0; min-width: 320px; } button, input, select, textarea { font: inherit; }
    .app { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; } aside { background: #103b28; color: #e9f3e9; padding: 24px 14px; } .brand { align-items: center; display: flex; gap: 10px; margin-bottom: 28px; } .mark { align-items: center; background: #d99038; border-radius: 10px; display: flex; font-size: 22px; height: 38px; justify-content: center; width: 38px; } .brand strong { display: block; font-size: 17px; } .brand span { color: #9fd3a4; } .brand small { color: #9bb9a5; display: block; font-size: 9px; margin-top: 2px; text-transform: uppercase; } nav { display: grid; gap: 4px; } nav a { border-radius: 7px; color: #abc3b1; display: block; font-size: 12px; padding: 11px; text-decoration: none; } nav a:hover, nav a.active { background: #e9f4e8; color: #175c36; font-weight: 700; }
    main { min-width: 0; } header { align-items: center; background: #fff; border-bottom: 1px solid #e0e9e1; display: flex; gap: 12px; justify-content: space-between; min-height: 70px; padding: 14px 32px; } header h1 { font-size: 21px; margin: 0; } .status { background: #fff1d8; border-radius: 999px; color: #9b6b25; font-size: 11px; padding: 7px 10px; } .content { margin: 0 auto; max-width: 1200px; padding: 30px 32px 50px; } .eyebrow { color: #689176; font-size: 10px; font-weight: 800; letter-spacing: .1em; margin: 0 0 7px; text-transform: uppercase; } .muted { color: #75857a; font-size: 12px; line-height: 1.55; } .grid { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 18px 0; } .card { background: #fff; border: 1px solid #e0e9e1; border-radius: 10px; padding: 18px; } .stat strong { display: block; font-size: 24px; margin-top: 6px; } .toolbar { align-items: center; display: flex; gap: 9px; justify-content: space-between; margin: 20px 0 12px; } .toolbar input { border: 1px solid #d7e5d9; border-radius: 7px; min-height: 38px; padding: 0 10px; width: min(330px, 100%); } .button { background: #176b3b; border: 0; border-radius: 7px; color: white; cursor: pointer; font-size: 11px; font-weight: 700; min-height: 38px; padding: 0 14px; } .button.secondary { background: #fff; border: 1px solid #d7e5d9; color: #176b3b; } .list { display: grid; gap: 0; } .row { align-items: center; border-top: 1px solid #edf2ed; display: flex; gap: 12px; justify-content: space-between; padding: 13px 0; } .row:first-child { border-top: 0; } .row strong, .row span { display: block; } .row span { color: #75857a; font-size: 10px; margin-top: 4px; } .badge { background: #fff1d8; border-radius: 20px; color: #9b6b25; font-size: 9px; padding: 5px 8px; white-space: nowrap; } .empty { border: 1px dashed #c9dccd; color: #75857a; padding: 28px; text-align: center; } dialog { border: 0; border-radius: 12px; box-shadow: 0 20px 60px #0f381f33; max-width: 520px; padding: 22px; width: calc(100% - 28px); } dialog::backdrop { background: #0a271866; } form { display: grid; gap: 12px; } label { color: #173b28; display: grid; font-size: 11px; font-weight: 700; gap: 5px; } input, select, textarea { border: 1px solid #d7e5d9; border-radius: 7px; min-height: 38px; padding: 8px 10px; } textarea { min-height: 80px; } .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 5px; }
    @media (max-width: 700px) { .app { display: block; } aside { padding: 14px 16px; } .brand { margin-bottom: 12px; } nav { display: flex; gap: 4px; overflow-x: auto; } nav a { flex: 0 0 auto; padding: 9px; } header { min-height: 58px; padding: 12px 16px; } .content { padding: 22px 16px 40px; } .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .toolbar { align-items: stretch; flex-direction: column; } .toolbar input { width: 100%; } }
  </style>
</head>
<body>
  <div class="app"><aside><div class="brand"><div class="mark">🐔</div><div><strong>Kuku<span>Dhamini</span></strong><small>Offline farm workspace</small></div></div><nav id="nav"><a href="#dashboard" data-view="dashboard">Dashboard</a><a href="#batches" data-view="batches">Batches</a><a href="#mortality" data-view="mortality">Mortality</a><a href="#feed" data-view="feed">Feed</a><a href="#sales" data-view="sales">Sales</a><a href="#payments" data-view="payments">Payments</a><a href="#expenses" data-view="expenses">Expenses</a><a href="#health" data-view="health">Health</a><a href="#notifications" data-view="notifications">Notifications</a><a href="#settings" data-view="settings">Settings</a></nav></aside><main><header><h1 id="title">Offline workspace</h1><span class="status" id="status">Working offline</span></header><section class="content" id="content"></section></main></div>
  <dialog id="dialog"><form id="record-form"><h2 id="form-title">Add record</h2><div id="fields"></div><div class="form-actions"><button class="button secondary" type="button" id="cancel">Cancel</button><button class="button" type="submit">Save on this device</button></div></form></dialog>
  <script>
    (() => {
      const labels = { dashboard: "Dashboard", batches: "Batches", mortality: "Mortality", feed: "Feed", sales: "Sales", payments: "Payments", expenses: "Expenses", health: "Health", notifications: "Notifications", settings: "Settings" };
      const entities = { batches: "batch", mortality: "mortality", feed: "feedTransaction", sales: "sale", payments: "payment", expenses: "expense", health: "healthTask", notifications: "notification" };
      const dbPromise = new Promise((resolve, reject) => { const request = indexedDB.open("kukudhamini-offline"); request.onsuccess = () => resolve(request.result); request.onerror = () => reject(request.error); });
      const store = (name, mode) => dbPromise.then(db => db.transaction(name, mode).objectStore(name));
      const all = (name) => store(name, "readonly").then(s => new Promise((resolve, reject) => { const r = s.getAll(); r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); }));
      const put = (name, value) => store(name, "readwrite").then(s => new Promise((resolve, reject) => { const r = s.put(value); r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error); }));
      const uuid = () => crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;
      const now = () => new Date().toISOString();
      const visible = (records, query) => records.filter(r => !r.deletedAt && JSON.stringify(r.data).toLowerCase().includes(query.toLowerCase())).sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
      const recordData = (record) => record.data || {};
      async function farmId() { const settings = await all("appSettings"); const farm = settings.find(s => String(s.key).startsWith("farm:")); return farm ? String(farm.key).slice(5) : (await all("records")).find(r => r.farmId)?.farmId; }
      async function records(entity) { return visible((await all("records")).filter(r => r.entity === entity), document.querySelector("#search")?.value || ""); }
      function value(data, keys, fallback = "") { for (const key of keys) if (data[key] !== undefined && data[key] !== null && data[key] !== "") return data[key]; return fallback; }
      function row(entity, record) { const data = recordData(record); const title = value(data, ["name", "title", "description", "productName", "batchCode", "buyer"], entity); const detail = value(data, ["date", "scheduledDate", "arrivalDate", "type", "cause", "notes"], "Locally saved"); return `<div class="row"><div><strong>${escapeHtml(title)}</strong><span>${escapeHtml(String(detail))}</span></div><span class="badge">${record.syncStatus === "synced" ? "SYNCED" : "PENDING SYNC"}</span></div>`; }
      function escapeHtml(value) { return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
      async function render() { const view = location.hash.slice(1) || "dashboard"; const base = view.split("/")[0]; document.querySelectorAll("nav a").forEach(a => a.classList.toggle("active", a.dataset.view === base)); document.querySelector("#title").textContent = labels[base] || "Offline workspace"; const content = document.querySelector("#content"); if (base === "settings") { const pending = (await all("syncQueue")).length; content.innerHTML = `<p class="eyebrow">Device storage</p><h2>Offline Center</h2><p class="muted">This workspace is reading farm data from this device. Unsynchronized changes remain queued.</p><div class="card"><strong>${pending}</strong><p class="muted">pending changes</p><button class="button secondary" id="reconnect">Reconnect and sync</button></div>`; document.querySelector("#reconnect").onclick = () => location.href = "/dashboard"; return; } if (base === "dashboard") { const allRecords = await all("records"); const count = entity => allRecords.filter(r => r.entity === entity && !r.deletedAt).length; content.innerHTML = `<p class="eyebrow">Last synchronized local dataset</p><h2>Offline farm overview</h2><p class="muted">Offline - showing locally saved data. New records are saved on this device.</p><div class="grid"><div class="card stat"><span class="muted">Active batches</span><strong>${count("batch")}</strong></div><div class="card stat"><span class="muted">Mortality records</span><strong>${count("mortality")}</strong></div><div class="card stat"><span class="muted">Feed records</span><strong>${count("feedTransaction")}</strong></div><div class="card stat"><span class="muted">Pending sync</span><strong>${(await all("syncQueue")).length}</strong></div></div><div class="card"><p class="muted">Financial and health totals reflect the records downloaded to this device.</p></div>`; return; } if (!entities[base]) { content.innerHTML = `<div class="card"><h2>Not downloaded yet</h2><p class="muted">This information has not been downloaded to this device yet.</p></div>`; return; } const list = await records(entities[base]); content.innerHTML = `<div class="toolbar"><input id="search" placeholder="Search locally saved records" value="${escapeHtml(document.querySelector("#search")?.value || "")}"><button class="button" id="add">Add record</button></div><div class="card"><div class="list">${list.length ? list.map(r => row(entities[base], r)).join("") : '<div class="empty">No locally saved records are available.</div>'}</div></div>`; document.querySelector("#search").oninput = render; document.querySelector("#add").onclick = () => openForm(base); }
      function openForm(base) { const dialog = document.querySelector("#dialog"); const fields = { batches: [["name","Batch name"],["breed","Breed"],["arrivalDate","Arrival date","date"],["initialBirdCount","Initial birds","number"],["expectedHarvestDate","Expected harvest","date"]], mortality: [["batchId","Batch ID"],["date","Date","date"],["quantity","Birds lost","number"],["cause","Cause"]], feed: [["productId","Feed product ID"],["type","Type"],["quantity","Quantity","number"],["unit","Unit"]], sales: [["batchId","Batch ID"],["date","Date","date"],["birdsSold","Birds sold","number"],["pricingMode","Pricing mode"],["pricePerBird","Price per bird","number"]], expenses: [["description","Description"],["categoryId","Category ID"],["amount","Amount (TZS)","number"],["date","Date","date"],["paymentMethod","Payment method"]], health: [["title","Task name"],["type","Type"],["scheduledAt","Scheduled date","datetime-local"],["instructions","Instructions"]] }; document.querySelector("#form-title").textContent = `Add ${labels[base].toLowerCase()}`; document.querySelector("#fields").innerHTML = (fields[base] || []).map(([name, label, type]) => `<label>${label}<input name="${name}" type="${type || "text"}" required></label>`).join(""); dialog.showModal(); dialog.dataset.base = base; }
      document.querySelector("#cancel").onclick = () => document.querySelector("#dialog").close();
      document.querySelector("#record-form").onsubmit = async event => { event.preventDefault(); const form = new FormData(event.target); const base = event.target.parentElement.dataset.base; const entity = entities[base]; const payload = Object.fromEntries(form.entries()); if (entity === "expense") { payload.quantity = "1"; payload.unit = "item"; payload.unitPrice = payload.amount; delete payload.amount; } const id = `local-${uuid()}`; const timestamp = now(); const farm = await farmId(); if (!farm) { alert("No farm data is available offline yet. Connect once to download this farm."); return; } await put("records", { localId: id, farmId: farm, entity, data: payload, createdAt: timestamp, updatedAt: timestamp, syncStatus: "pending" }); await put("syncQueue", { operationId: uuid(), localId: id, farmId: farm, entity, operation: "create", payload, createdAt: timestamp, attempts: 0, nextAttemptAt: timestamp, status: "pending" }); event.target.parentElement.close(); location.hash = base; render(); };
      const returnPath = "__RETURN_PATH__"; window.addEventListener("hashchange", render); window.addEventListener("online", () => { document.querySelector("#status").textContent = "Connection restored"; setTimeout(() => location.href = returnPath.startsWith("__") ? "/dashboard" : returnPath, 500); }); render().catch(() => { document.querySelector("#content").innerHTML = '<div class="card"><h2>Offline data unavailable</h2><p class="muted">Connect to the internet once to download this farm for offline use.</p></div>'; });
      document.addEventListener("click", async event => { const row = event.target.closest(".row"); if (!row) return; const base = location.hash.slice(1).split("/")[0]; const entity = entities[base]; if (!entity) return; const list = await records(entity); const record = list[Array.from(document.querySelectorAll(".row")).indexOf(row)]; if (!record) return; const data = recordData(record); document.querySelector("#content").innerHTML = `<div class="toolbar"><a class="button secondary" href="#${base}">Back to ${labels[base]}</a></div><div class="card"><p class="eyebrow">${labels[base]}</p><h2>${escapeHtml(value(data, ["name", "title", "description", "productName", "batchCode"], "Record"))}</h2><p class="muted">${record.syncStatus === "synced" ? "Synced to the farm database." : "Saved on this device. It will sync automatically when connection returns."}</p><div class="list">${Object.entries(data).map(([key, item]) => `<div class="row"><div><strong>${escapeHtml(key)}</strong><span>${escapeHtml(String(item ?? ""))}</span></div></div>`).join("")}</div></div>`; });
    })();
  </script>
</body>
</html>
